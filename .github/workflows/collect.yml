name: Collect OKX Trades
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch OKX trades (1min loop)
        run: python3 collect.py
      
      - name: Commit and push if changed
        run: |
          git config user.name 'okx-collector[bot]'
          git config user.email 'bot@okx-collector.local'
          git add data/
          git diff --staged --quiet || (git commit -m "trades $(date -u +%Y-%m-%dT%H:%M)" && git push)
