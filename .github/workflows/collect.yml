name: Collect OKX Trades + DOM
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Collect trades (1min)
        run: python3 collect.py
      
      - name: Collect DOM (30s)
        run: python3 okx_dom_collector.py
      
      - name: Commit and push
        run: |
          git config user.name 'okx-collector[bot]'
          git config user.email 'bot@okx-collector.local'
          git add data/
          git diff --staged --quiet || (git commit -m "data $(date -u +%Y-%m-%dT%H:%M)" && git push)
